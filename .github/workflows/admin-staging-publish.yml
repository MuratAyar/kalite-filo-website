name: Admin staging publish

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Frozen admin publish request ID
        required: true
        type: string
      snapshot_hash:
        description: Frozen admin snapshot SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admin-staging-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Validate, build and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    steps:
      - name: Check out trusted publisher code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install PHP mail runtime
        run: composer --working-dir=server/forms install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Claim frozen request and download required private media
        id: claim
        env:
          KALITE_FILO_STAGING_RUNNER_TOKEN: ${{ secrets.KALITE_FILO_STAGING_RUNNER_TOKEN }}
        run: >-
          node scripts/fetch-staging-publish-inputs.mjs
          --request-id "${{ inputs.request_id }}"
          --snapshot-hash "${{ inputs.snapshot_hash }}"
          --output "$RUNNER_TEMP/kalite-filo/request.json"
          --private-data-root "$RUNNER_TEMP/kalite-filo/private-data"

      - name: Materialize, validate and build static staging release
        id: build
        run: >-
          node scripts/run-staging-publish.mjs
          --request "$RUNNER_TEMP/kalite-filo/request.json"
          --private-data-root "$RUNNER_TEMP/kalite-filo/private-data"
          --repository .
          --review "$RUNNER_TEMP/kalite-filo/review"
          --backup "$RUNNER_TEMP/kalite-filo/backup"
          --artifact "$RUNNER_TEMP/kalite-filo/staging-release.tar"
          --result "$RUNNER_TEMP/kalite-filo/runner-result.json"
          --apply

      - name: Upload, activate and smoke-test staging
        id: deploy
        env:
          KALITE_FILO_STAGING_RUNNER_TOKEN: ${{ secrets.KALITE_FILO_STAGING_RUNNER_TOKEN }}
        run: >-
          node scripts/deploy-staging-via-admin-api.mjs
          --release-result "$RUNNER_TEMP/kalite-filo/runner-result.json"
          --artifact "$RUNNER_TEMP/kalite-filo/staging-release.tar"

      - name: Report a runner failure to Admin Dashboard
        if: ${{ failure() && steps.deploy.outcome != 'failure' }}
        continue-on-error: true
        env:
          KALITE_FILO_STAGING_RUNNER_TOKEN: ${{ secrets.KALITE_FILO_STAGING_RUNNER_TOKEN }}
        run: >-
          node scripts/report-staging-publish-failure.mjs
          --result "$RUNNER_TEMP/kalite-filo/runner-result.json"
          --request-id "${{ inputs.request_id }}"
          --snapshot-hash "${{ inputs.snapshot_hash }}"
